spring.application.name=gameflix-auth
spring.profiles.active=local

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gameflix_auth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gameflix_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update